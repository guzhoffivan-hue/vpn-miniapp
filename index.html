<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1a3fa6">
<meta name="color-scheme" content="light">
<meta name="robots" content="noindex, nofollow">
<title>Протри стекло</title>
<style>
  :root {
    --ink: #0d1530;
    --ink-soft: rgba(13, 21, 48, 0.46);
    --glass-top: rgba(255, 255, 255, 0.60);
    --glass-bottom: rgba(255, 255, 255, 0.34);
    --glass-border: rgba(255, 255, 255, 0.78);
    --glass-strong: rgba(255, 255, 255, 0.72);
  }

  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }

  html, body { min-height: 100%; }

  body {
    font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Inter", "Segoe UI", Roboto, system-ui, sans-serif;
    color: var(--ink);
    background: #1a3fa6;
    -webkit-font-smoothing: antialiased;
    text-rendering: optimizeLegibility;
  }

  /* ---------- «Телефон» ---------- */
  .phone {
    position: relative;
    isolation: isolate;
    width: 100%;
    max-width: 430px;
    min-height: 100vh;
    min-height: 100dvh;
    margin: 0 auto;
    overflow: hidden;
  }

  /* ---------- Фон ---------- */
  .art {
    position: absolute;
    inset: 0;
    z-index: -1;
    background:
      radial-gradient(80% 40% at 0% 62%, rgba(24, 170, 158, 0.95) 0%, rgba(24, 170, 158, 0) 68%),
      radial-gradient(85% 45% at 100% 100%, rgba(40, 146, 240, 0.92) 0%, rgba(40, 146, 240, 0) 70%),
      radial-gradient(72% 42% at 100% 0%, #030820 0%, rgba(3, 8, 32, 0) 74%),
      radial-gradient(85% 38% at 0% 0%, #e6f8fa 0%, rgba(230, 248, 250, 0) 70%),
      linear-gradient(180deg, #a9dde6 0%, #6db2dc 36%, #2a56c6 70%, #0d2a8e 100%);
  }

  .art::after {
    content: "";
    position: absolute;
    inset: 0;
    opacity: 0.09;
    mix-blend-mode: overlay;
    background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='180' height='180'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='2' stitchTiles='stitch'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>");
  }

  .petal { position: absolute; overflow: hidden; }

  .petal--blue {
    right: -14%;
    top: -3%;
    width: 78%;
    height: 60%;
    border-radius: 58% 42% 62% 38% / 55% 58% 42% 45%;
    transform: rotate(-9deg);
    background: linear-gradient(200deg, #86a2f6 0%, #4366d8 45%, #1d34a2 100%);
    box-shadow: inset 0 0 70px rgba(255, 255, 255, 0.2), 0 40px 90px rgba(6, 14, 70, 0.35);
  }

  .petal--blue::after {
    content: "";
    position: absolute;
    inset: -25%;
    background: repeating-linear-gradient(112deg,
      rgba(255, 255, 255, 0) 0 26px,
      rgba(196, 218, 255, 0.6) 26px 58px,
      rgba(255, 255, 255, 0) 58px 98px);
    filter: blur(9px);
    mix-blend-mode: soft-light;
  }

  .petal--mint {
    left: -32%;
    top: 30%;
    width: 84%;
    height: 56%;
    border-radius: 48% 52% 55% 45% / 52% 48% 52% 48%;
    transform: rotate(14deg);
    background: linear-gradient(160deg, #a6efd9 0%, #35bfae 52%, #15857f 100%);
    opacity: 0.92;
  }

  .sheen {
    position: absolute;
    left: 36%;
    top: 40%;
    width: 46%;
    height: 17%;
    background: radial-gradient(closest-side, rgba(255, 255, 255, 0.6), rgba(255, 255, 255, 0));
    filter: blur(22px);
  }

  /* ---------- Контент ---------- */
  .content {
    display: flex;
    flex-direction: column;
    gap: 22px;
    padding: calc(env(safe-area-inset-top, 0px) + 18px) 24px calc(env(safe-area-inset-bottom, 0px) + 24px);
  }

  .glass {
    background: linear-gradient(180deg, var(--glass-top), var(--glass-bottom));
    border: 1px solid var(--glass-border);
    -webkit-backdrop-filter: blur(26px) saturate(170%);
    backdrop-filter: blur(26px) saturate(170%);
    box-shadow: 0 12px 36px rgba(10, 25, 90, 0.22), inset 0 1px 0 rgba(255, 255, 255, 0.7);
  }

  /* ---------- Верхняя строка ---------- */
  .top {
    display: flex;
    align-items: center;
    gap: 8px;
    margin: 0 -9px 4px;
  }

  .blue-dot {
    flex: none;
    border-radius: 50%;
    background: radial-gradient(circle at 30% 22%, #55adff 0%, #1a80f4 55%, #0f5fd8 100%);
    box-shadow: 0 6px 18px rgba(16, 90, 220, 0.38), inset 0 1px 0 rgba(255, 255, 255, 0.55);
    background-size: cover;
    background-position: center;
  }

  .avatar { width: 54px; height: 54px; }

  .name {
    min-width: 0;
    max-width: 62%;
    padding: 6px 18px;
    border-radius: 999px;
    font-size: 15px;
    font-weight: 500;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  .status {
    flex: none;
    width: 50px;
    height: 50px;
    margin-left: auto;
    display: grid;
    place-items: center;
  }

  /* ---------- Серверы ---------- */
  .locs { display: flex; flex-direction: column; gap: 22px; }

  .loc {
    min-height: 86px;
    padding: 14px 20px;
    border-radius: 46px;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    text-align: center;
  }

  .loc__title { font-size: 19px; font-weight: 500; line-height: 1.2; }
  .loc__sub { margin-top: 2px; font-size: 12px; line-height: 1.3; color: var(--ink-soft); }
  .loc[aria-disabled="true"] { cursor: default; }

  /* ---------- Табы ---------- */
  .tabs {
    --i: 0;
    position: relative;
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    padding: 4px;
    border-radius: 999px;
  }

  .pill {
    position: absolute;
    top: 4px;
    bottom: 4px;
    left: 4px;
    width: calc((100% - 8px) / 4);
    border-radius: 999px;
    background: var(--glass-strong);
    box-shadow: 0 4px 14px rgba(10, 25, 90, 0.16), inset 0 1px 0 rgba(255, 255, 255, 0.85);
    transform: translateX(calc(var(--i) * 100%));
    transition: transform 0.38s cubic-bezier(0.3, 0.8, 0.3, 1);
  }

  .tab {
    position: relative;
    z-index: 1;
    padding: 11px 2px;
    border: 0;
    border-radius: 999px;
    background: none;
    font: inherit;
    font-size: 14px;
    color: var(--ink);
    cursor: pointer;
  }

  .tab + .tab::before {
    content: "";
    position: absolute;
    left: 0;
    top: 26%;
    bottom: 26%;
    width: 1px;
    background: rgba(13, 21, 48, 0.2);
    transition: opacity 0.2s;
  }

  .tab[aria-selected="true"] { font-weight: 650; }
  .tab[aria-selected="true"]::before,
  .tab[aria-selected="true"] + .tab::before { opacity: 0; }
  .tab:focus-visible { outline: 2px solid rgba(13, 21, 48, 0.6); outline-offset: -2px; }

  /* ---------- Карточка подключения ---------- */
  .card {
    margin-top: 10px;
    padding: 20px 13px 13px;
    border-radius: 36px;
  }

  .card__text { padding: 0 9px; }

  .card h1 {
    font-size: 17px;
    font-weight: 700;
    margin-bottom: 10px;
  }

  .card p {
    font-size: 16px;
    line-height: 1.36;
  }

  .card p a {
    color: inherit;
    text-decoration: underline;
    text-decoration-color: rgba(13, 21, 48, 0.35);
    text-underline-offset: 3px;
  }

  .card .hint {
    margin-top: 10px;
    font-size: 14px;
    line-height: 1.4;
    color: rgba(13, 21, 48, 0.62);
  }

  .note {
    padding: 0 12px;
    text-align: center;
    font-size: 13px;
    line-height: 1.4;
    color: rgba(255, 255, 255, 0.9);
    text-shadow: 0 1px 10px rgba(5, 15, 70, 0.4);
  }

  .note:empty { display: none; }

  .copy {
    margin-top: 22px;
    width: 100%;
    height: 50px;
    padding: 0 16px;
    border: 0;
    border-radius: 26px;
    font: inherit;
    font-size: 16px;
    font-weight: 500;
    color: var(--ink);
    cursor: pointer;
    background: rgba(70, 92, 120, 0.2);
    box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.4);
    transition: background 0.2s, transform 0.12s;
  }

  .copy:hover { background: rgba(70, 92, 120, 0.28); }
  .copy:active { transform: scale(0.985); }
  .copy:focus-visible { outline: 2px solid rgba(13, 21, 48, 0.6); outline-offset: 2px; }
  .copy.is-done { background: rgba(32, 150, 110, 0.38); }
  .copy[disabled] { cursor: default; opacity: 0.7; }

  /* ---------- Десктоп: показываем «телефоном» ---------- */
  @media (min-width: 520px) {
    body {
      display: grid;
      place-items: center;
      padding: 24px;
      background: radial-gradient(80% 70% at 50% 40%, #1f3f9c 0%, #070d2e 100%);
    }
    .phone {
      min-height: min(860px, calc(100dvh - 48px));
      border-radius: 40px;
      box-shadow: 0 30px 80px rgba(0, 0, 0, 0.45);
    }
  }

  @media (prefers-reduced-motion: reduce) {
    .pill, .copy, .tab + .tab::before { transition: none; }
  }
</style>
</head>
<body>
  <main class="phone">
    <div class="art" aria-hidden="true">
      <div class="petal petal--mint"></div>
      <div class="sheen"></div>
      <div class="petal petal--blue"></div>
    </div>

    <div class="content">
      <header class="top">
        <div class="blue-dot avatar" id="avatar" aria-hidden="true"></div>
        <div class="name glass" id="name">Пользователь</div>
        <div class="blue-dot status" role="img" aria-label="Доступ активен">
          <svg viewBox="0 0 24 24" width="26" height="26" fill="none" stroke="#fff" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>
        </div>
      </header>

      <!-- Серверы: меняй текст прямо здесь. Недоступный — с aria-disabled="true". -->
      <section class="locs" aria-label="Сервер">
        <div class="loc glass">
          <span class="loc__title">Швеция</span>
          <span class="loc__sub">Стокгольм</span>
        </div>
        <div class="loc glass" aria-disabled="true">
          <span class="loc__title">Недоступно</span>
          <span class="loc__sub">Потом добавлю</span>
        </div>
      </section>

      <div class="tabs glass" id="tabs" role="tablist" aria-label="Платформа">
        <span class="pill" aria-hidden="true"></span>
        <button class="tab" role="tab" data-p="ios" aria-selected="true">iOS</button>
        <button class="tab" role="tab" data-p="android" aria-selected="false">Android</button>
        <button class="tab" role="tab" data-p="macos" aria-selected="false">macOS</button>
        <button class="tab" role="tab" data-p="windows" aria-selected="false">Windows</button>
      </div>

      <article class="card glass" role="tabpanel">
        <div class="card__text">
          <h1>Подключить</h1>
          <p>Используйте <a id="happ" href="#" target="_blank" rel="noopener">Happ</a><br>скопируйте ссылку и вставьте в клиенте из буфера обмена</p>
          <p class="hint" id="hint"></p>
        </div>
        <button class="copy" id="copy" type="button">Скопировать</button>
      </article>

      <p class="note" id="note"></p>
    </div>
  </main>

<script src="https://telegram.org/js/telegram-web-app.js"></script>
<script>
(function () {
  "use strict";

  /* ============================================================
     НАСТРОЙКИ — здесь ничего секретного хранить не нужно.
     ============================================================ */
  var CONFIG = {
    // Вариант 1 (рекомендуется): адрес подписки Marzban БЕЗ токена,
    // например "https://example.com/sub/". Токен каждого человека берётся
    // из адреса страницы после «#»:  .../vpn-miniapp/#ТОКЕН
    // Тогда в самой странице нет ни одного ключа.
    subBase: "http://138.124.35.240:8000/sub/",

    // Вариант 2: одна общая ссылка целиком (подписка https://… или ключ vless://…).
    // Помни: всё, что вписано сюда, видно любому, кто откроет страницу.
    directLink: "",

    // Надпись про оплату внизу. Пустая строка — надпись скрыта.
    note: "Сервер платный — если пользуетесь, поддержите по-дружески. Реквизиты — в личке."
  };

  // Для каждой платформы: куда ведёт слово «Happ» и какая подсказка показывается в карточке.
  var PLATFORMS = {
    ios: {
      install: "https://apps.apple.com/app/id6504287215",
      hint: "Установите Happ из App Store, затем в приложении нажмите «+» и выберите импорт из буфера обмена."
    },
    android: {
      install: "https://www.happ.su",
      hint: "Установите Happ из Google Play или с сайта, затем нажмите «+» и выберите импорт из буфера обмена."
    },
    macos: {
      install: "https://apps.apple.com/app/id6504287215",
      hint: "Установите Happ из App Store, затем нажмите «+» и импортируйте ссылку из буфера обмена."
    },
    windows: {
      install: "https://www.happ.su",
      hint: "Скачайте Happ с сайта, затем нажмите «+» и импортируйте ссылку из буфера обмена."
    }
  };

  var ORDER = ["ios", "android", "macos", "windows"];

  /* ============================================================ */

  var tabsEl = document.getElementById("tabs");
  var tabs = Array.prototype.slice.call(tabsEl.querySelectorAll(".tab"));
  var copyBtn = document.getElementById("copy");
  var happEl = document.getElementById("happ");
  var hintEl = document.getElementById("hint");
  var noteEl = document.getElementById("note");
  var nameEl = document.getElementById("name");
  var avatarEl = document.getElementById("avatar");
  var resetTimer = null;

  function getLink() {
    // 1. Проверяем query-параметры (?sub=... или ?key=...) от Telegram-бота
    try {
      var params = new URLSearchParams(window.location.search);
      var subParam = params.get("sub") || params.get("key") || params.get("url");
      if (subParam && subParam.trim()) {
        return subParam.trim();
      }
    } catch (e) {}

    // 2. Проверяем hash (#vless://... или #ТОКЕН)
    var hash = (location.hash || "").replace(/^#/, "").trim();
    if (hash) {
      try {
        var decodedHash = decodeURIComponent(hash);
        if (/^(vless|vmess|trojan|ss|hy2|hysteria2|tuic|http|https):\/\//i.test(decodedHash)) {
          return decodedHash;
        }
      } catch (e) {}
      if (CONFIG.subBase && /^[A-Za-z0-9._~\-]+$/.test(hash)) {
        return CONFIG.subBase.replace(/\/?$/, "/") + hash;
      }
    }

    // 3. Прямая ссылка из конфига
    return CONFIG.directLink || "";
  }

  function detectPlatform() {
    var ua = navigator.userAgent || "";
    if (/iPhone|iPad|iPod/i.test(ua)) return "ios";
    if (/Android/i.test(ua)) return "android";
    if (/Windows/i.test(ua)) return "windows";
    if (/Macintosh|Mac OS X/i.test(ua)) return (navigator.maxTouchPoints > 1) ? "ios" : "macos";
    return "ios";
  }

  function select(platform, focus) {
    var idx = Math.max(0, ORDER.indexOf(platform));
    tabsEl.style.setProperty("--i", idx);
    tabs.forEach(function (t, i) {
      var on = i === idx;
      t.setAttribute("aria-selected", on ? "true" : "false");
      t.tabIndex = on ? 0 : -1;
      if (on && focus) t.focus();
    });
    var cfg = PLATFORMS[ORDER[idx]];
    happEl.href = cfg.install;
    hintEl.textContent = cfg.hint;
  }

  function refreshLinkState() {
    var has = !!getLink();
    copyBtn.disabled = !has;
    copyBtn.textContent = has ? "Скопировать" : "Ссылка не настроена";
  }

  function fallbackCopy(text) {
    try {
      var ta = document.createElement("textarea");
      ta.value = text;
      ta.setAttribute("readonly", "");
      ta.style.cssText = "position:fixed;top:0;left:0;opacity:0;pointer-events:none;";
      document.body.appendChild(ta);
      ta.focus();
      ta.select();
      ta.setSelectionRange(0, text.length);
      var ok = document.execCommand("copy");
      document.body.removeChild(ta);
      return ok;
    } catch (e) {
      return false;
    }
  }

  function copyText(text) {
    // Сначала пробуем синхронное копирование, чтобы не терять контекст клика в WebView
    var syncOk = fallbackCopy(text);
    if (syncOk) {
      if (navigator.clipboard && window.isSecureContext) {
        navigator.clipboard.writeText(text).catch(function () {});
      }
      return Promise.resolve(true);
    }
    if (navigator.clipboard && window.isSecureContext) {
      return navigator.clipboard.writeText(text).then(function () { return true; }, function () { return false; });
    }
    return Promise.resolve(false);
  }

  function launchHapp(link) {
    var happDirectUrl = "happ://add/" + encodeURIComponent(link);
    var happSimpleUrl = "happ://";
    var ua = navigator.userAgent || "";
    var isIOS = /iPad|iPhone|iPod/i.test(ua) || (navigator.platform === "MacIntel" && navigator.maxTouchPoints > 1);

    if (isIOS) {
      var a = document.createElement("a");
      a.href = happDirectUrl;
      a.target = "_top";
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
    } else {
      var iframe = document.createElement("iframe");
      iframe.style.display = "none";
      iframe.src = happDirectUrl;
      document.body.appendChild(iframe);

      setTimeout(function () {
        iframe.src = happSimpleUrl;
      }, 300);

      setTimeout(function () {
        if (iframe.parentNode) {
          iframe.parentNode.removeChild(iframe);
        }
      }, 1500);
    }
  }

  copyBtn.addEventListener("click", function () {
    var link = getLink();
    if (!link) return;

    copyText(link).then(function (ok) {
      try {
        var tg = window.Telegram && window.Telegram.WebApp;
        if (tg && tg.HapticFeedback) {
          tg.HapticFeedback.notificationOccurred(ok ? "success" : "error");
        }
      } catch (e) {}

      copyBtn.textContent = ok ? "Скопировано ✓" : "Не вышло — скопируйте вручную";
      copyBtn.classList.toggle("is-done", ok);
      clearTimeout(resetTimer);
      resetTimer = setTimeout(function () {
        copyBtn.textContent = "Скопировать";
        copyBtn.classList.remove("is-done");
      }, 2200);

      // Безопасное автооткрытие Happ без ошибки ERR_UNKNOWN_URL_SCHEME
      launchHapp(link);
    });
  });

  // Безопасное открытие внешней ссылки на скачивание Happ через Telegram WebApp API
  happEl.addEventListener("click", function (e) {
    try {
      var tg = window.Telegram && window.Telegram.WebApp;
      if (tg && typeof tg.openLink === "function" && happEl.href && /^https?:\/\//i.test(happEl.href)) {
        e.preventDefault();
        tg.openLink(happEl.href);
      }
    } catch (err) {}
  });

  tabs.forEach(function (t) {
    t.addEventListener("click", function () {
      try {
        var tg = window.Telegram && window.Telegram.WebApp;
        if (tg && tg.HapticFeedback) tg.HapticFeedback.selectionChanged();
      } catch (e) {}
      select(t.getAttribute("data-p"));
    });
  });

  tabsEl.addEventListener("keydown", function (e) {
    var cur = ORDER.indexOf(tabs.filter(function (t) { return t.getAttribute("aria-selected") === "true"; })[0].getAttribute("data-p"));
    if (e.key === "ArrowRight") { select(ORDER[(cur + 1) % ORDER.length], true); e.preventDefault(); }
    if (e.key === "ArrowLeft") { select(ORDER[(cur + ORDER.length - 1) % ORDER.length], true); e.preventDefault(); }
  });

  window.addEventListener("hashchange", refreshLinkState);
  window.addEventListener("popstate", refreshLinkState);

  noteEl.textContent = CONFIG.note || "";
  select(detectPlatform());
  refreshLinkState();

  function initTelegramUser() {
    try {
      var tg = window.Telegram && window.Telegram.WebApp;
      if (!tg) return;
      tg.ready();
      tg.expand();
      var u = tg.initDataUnsafe && tg.initDataUnsafe.user;
      if (u) {
        var full = ((u.first_name || "") + " " + (u.last_name || "")).trim();
        if (full) nameEl.textContent = full;
        if (u.photo_url && /^https:\/\//.test(u.photo_url)) {
          avatarEl.style.backgroundImage = 'url("' + String(u.photo_url).replace(/"/g, "%22") + '")';
        }
      }
    } catch (e) {}
  }

  initTelegramUser();
  window.addEventListener("load", initTelegramUser);
})();
</script>
</body>
</html>
